[project]
name = "uav-ml"
version = "0.1.0"
description = "Data splits, evaluation metrics with bootstrap CIs, and training configs"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8,<5",
    "pyyaml>=6.0",
    "uav-core",
    "uav-edge",
]

[project.scripts]
uav-ml-split = "uav_ml.splits:main"
uav-ml-eval = "uav_ml.evaluate:main"

[tool.uv.sources]
uav-core = { workspace = true }
uav-edge = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uav_ml"]
