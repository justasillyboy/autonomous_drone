[project]
name = "uav-edge"
version = "0.1.0"
description = "Segmentation backends (ONNX, Ultralytics, Hailo) behind one interface"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.8,<5",
    "uav-core",
]

[project.scripts]
uav-edge-bench = "uav_edge.bench:main"
uav-edge-compile = "uav_edge.hailo_compile:main"

[project.optional-dependencies]
# Pulls in torch; install only where needed: uv sync --extra ultralytics
ultralytics = ["ultralytics>=8.3"]

[tool.uv.sources]
uav-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uav_edge"]
