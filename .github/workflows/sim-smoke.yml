name: Simulation smoke test

# Builds the Gazebo + ArduCopter SITL image and runs scripts/sim_smoke.sh headless (software
# rendering): world validation, the ADR-0003 direction check (release gate) and one qualifier
# match scored by the independent referee. Logs are uploaded and their tails annotated.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/sim.Dockerfile
      - ros2_ws/**
      - uav_core/src/**
      - edge/src/**
      - .github/workflows/sim-smoke.yml
      - scripts/sim_smoke.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the simulation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/sim.Dockerfile
          tags: uav-sim:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fetch the model
        run: scripts/fetch_assets.sh yolo11s-seg_synth_export-2026-04-24.onnx

      - name: World check, direction check (ADR-0003 gate), qualifier match
        run: scripts/sim_smoke.sh uav-sim:ci yolo11s-seg_synth_export-2026-04-24.onnx

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-results
          path: results/
