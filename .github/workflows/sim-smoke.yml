name: Simulation smoke test

# Builds the Gazebo + ArduCopter SITL image and runs it headless (software rendering):
# 1. the ADR-0003 direction check (release gate), 2. one qualifier match scored by the
# independent referee. Results are uploaded and summarised as annotations.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/sim.Dockerfile
      - ros2_ws/**
      - uav_core/src/**
      - edge/src/**
      - .github/workflows/sim-smoke.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the simulation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/sim.Dockerfile
          tags: uav-sim:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fetch the model
        run: scripts/fetch_assets.sh yolo11s-seg_synth_export-2026-04-24.onnx

      - name: Validate the generated world
        run: |
          docker run --rm -v "$PWD/results:/results" uav-sim:ci bash -c \
            "ros2 run uav_sim make_world --seed 0 --out /results/world && \
             GZ_SIM_RESOURCE_PATH=/results/world/models:\$ARDUPILOT_GAZEBO/models \
             gz sdf -k /results/world/competition_field.sdf"

      - name: Direction check (ADR-0003 release gate)
        run: |
          mkdir -p results
          docker run --rm -v "$PWD/assets:/assets:ro" -v "$PWD/results:/results" uav-sim:ci \
            timeout --signal=INT 600 ros2 launch uav_bringup sim.launch.py \
            weights:=/assets/yolo11s-seg_synth_export-2026-04-24.onnx \
            mode:=direction_check results_dir:=/results || true
          python3 - <<'EOF'
          import json, pathlib, sys
          p = pathlib.Path("results/direction_check.json")
          if not p.exists():
              print("::error::direction check produced no result"); sys.exit(1)
          r = json.loads(p.read_text())
          level = "notice" if r["passed"] else "error"
          print(f"::{level}::direction check {'passed' if r['passed'] else 'FAILED'}: {r['steps']}")
          sys.exit(0 if r["passed"] else 1)
          EOF

      - name: Qualifier match, seed 0
        run: |
          docker run --rm -v "$PWD/assets:/assets:ro" -v "$PWD/results:/results" uav-sim:ci \
            timeout --signal=INT 900 ros2 launch uav_bringup sim.launch.py \
            weights:=/assets/yolo11s-seg_synth_export-2026-04-24.onnx \
            seed:=0 results_dir:=/results || true
          python3 - <<'EOF'
          import json, pathlib, sys
          p = pathlib.Path("results/qualifier-00000.json")
          if not p.exists():
              print("::error::the referee wrote no result"); sys.exit(1)
          r = json.loads(p.read_text())
          print(f"::notice::referee score {r['score']}, hit {r['targets_hit']}, "
                f"landed on helipad {r['landed_on_helipad']}, failures {r['failures']}")
          sys.exit(0 if r["takeoff"] else 1)
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-results
          path: results/
